  <body>
    <p>Rock Paper And Scissors game</p>

    <button
      onclick="
        const randomNumber = Math.random();

        let computerMove = '';
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = 'scissros';
        } else {
          console.log('Hello');
        }

        console.log(computerMove);

        let result = '';

        if (computerMove === 'rock') {
          result = 'Tie';
        } else if (computerMove === 'paper') {
          result = 'You lose';
        } else if (computerMove === 'scissros') {
          result = 'You win.';
        }

        alert(
          `You pick rock. Computer picked ${computerMove}.result is : ${result}`,
        );
      "
    >
      Rock
    </button>
