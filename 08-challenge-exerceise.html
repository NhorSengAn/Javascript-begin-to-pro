<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge-exerceise</title>
  </head>
  <body>
    <button onclick="playGame('heads')">Heads</button>
    <button onclick="playGame('tails')">Tails</button>
    <button
      onclick="
        score.wins = 0;
        score.losse = 0;
        localStorage.removeItem('score');
      "
    >
      Rest score
    </button>
    <script>
      let score = JSON.parse(localStorage.getItem("score")) || {
        wins: 0,
        losse: 0,
      };

      function playGame(playerMove) {
        const computerMove = pickComputerMove();

        let result = "";

        if (playerMove === computerMove) {
          result = "You Win";
        } else {
          result = "You Lose";
        }

        if (result === "You Win") {
          score.wins += 1;
        } else if (result === "You Lose") {
          score.losse += 1;
        }

        localStorage.setItem("score", JSON.stringify(score));
        alert(
          `You pick ${playerMove}. Computer picked ${computerMove}.result is : ${result}
                      win:${score.wins}, losses: ${score.losse}
          `,
        );
        console.log(result);
      }

      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = "";

        if (randomNumber >= 0 && randomNumber < 0.5) {
          computerMove = "heads";
        } else {
          computerMove = "tails";
        }
        return computerMove;
      }
    </script>
  </body>
</html>
