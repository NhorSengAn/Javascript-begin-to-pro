<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function</title>
  </head>
  <body>
    <p>Rock Paper And Scissors game</p>

    <button onclick="playGame('rock')">Rock</button>

    <button onclick="playGame('paper')">Paper</button>

    <button onclick="playGame('scissros')">Scissors</button>
    <button
      onclick="
        score.wins = 0;
        score.losse = 0;
        score.tie = 0;
        localStorage.removeItem('score');
      "
    >
      Reset score
    </button>

    <script>
      let score = JSON.parse(localStorage.getItem("score")) || {
        wins: 0,
        losse: 0,
        tie: 0,
      };

      // if (!score) {
      //   score = {
      //     wins: 0,
      //     losse: 0,
      //     tie: 0,
      //   };
      // }

      function playGame(playerMove) {
        const computerMove = pickComputerMove();

        let result = "";

        if (playerMove === "scissros") {
          if (computerMove === "rock") {
            result = "You lose";
          } else if (computerMove === "paper") {
            result = "You win";
          } else if (computerMove === "scissros") {
            result = "Tie.";
          }
        } else if (playerMove === "paper") {
          if (computerMove === "rock") {
            result = "You win";
          } else if (computerMove === "paper") {
            result = "Tie";
          } else if (computerMove === "scissros") {
            result = "You lose.";
          }
        } else if (playerMove === "rock") {
          if (computerMove === "rock") {
            result = "Tie";
          } else if (computerMove === "paper") {
            result = "You lose";
          } else if (computerMove === "scissros") {
            result = "You win.";
          }
        }

        if (result === "You win") {
          score.wins += 1;
        } else if (result === "You lose") {
          score.losse += 1;
        } else if (result === "Tie") {
          score.tie += 1;
        }

        localStorage.setItem("score", JSON.stringify(score));

        alert(
          `You pick ${playerMove}. Computer picked ${computerMove}.result is : ${result}
                      win:${score.wins}, losses: ${score.losse} ,Ties : ${score.tie}
          `,
        );
      }

      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = "";

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = "paper";
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = "scissros";
        }
        return computerMove;
        //after we use return statement that's mean our code is end
      }
    </script>
  </body>
</html>
