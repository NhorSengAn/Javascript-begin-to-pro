<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom Project</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      .js-subscribe-button {
        border: none;
        background-color: black;
        color: white;
        border-radius: 5px;
        padding: 10px 15px;
        cursor: pointer;
        transition: ease-in-out;
        font-weight: bold;
        margin-top: 30px;
      }

      .is-subscribe-button {
        background-color: gray;
        color: white;
      }

      .js-cost-input {
        padding: 10px;
        border: none;
        border-radius: 5px;
        border: 1px solid gray;
        cursor: pointer;
      }

      .calculate {
        padding: 10px;
        background-color: seagreen;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        border: none;
      }
    </style>
  </head>
  <body>
    <p>Youtube Subscribe button</p>
    <button onclick="subscribe()" class="js-subscribe-button">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input
      type="text"
      placeholder="Cost of order"
      class="js-cost-input"
      onkeydown="handleCostkeydown(event)"
    />
    <button onclick="calculateTotal()" class="calculate">Calculator</button>
    <p class="js-total-cost"></p>
    <script>
      function handleCostkeydown(event) {
        if (event.key === "Enter") {
          calculateTotal();
        }
      }

      function calculateTotal() {
        const inputElement = document.querySelector(".js-cost-input");
        let cost = Number(inputElement.value);
        console.log(typeof cost);
        console.log(cost);
        if (cost < 40) {
          cost = cost + 10; // this call a type Coercion
        }

        document.querySelector(".js-total-cost").innerHTML = `$ ${cost}`;
      }

      // document.querySelector(".js-subscribe").innerHTML = "Subscribed"; //

      function subscribe() {
        const buttonElement = document.querySelector(".js-subscribe-button");
        if (buttonElement.innerText === "Subscribe") {
          buttonElement.innerText = "Subscribed";
          buttonElement.classList.add("is-subscribe-button");
        } else {
          buttonElement.innerText = "Subscribe";
          buttonElement.classList.remove("is-subscribe-button");
        }
      }
    </script>
  </body>
</html>
