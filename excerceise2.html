<!-- 
 7g. Create a function convertLength(length, from, to) that takes a
number and a unit ('km' or 'miles') and converts the length to another
unit ('km' or 'miles'). Note: 1 mile = 1.6 km (approximately).
• convertLength(50, 'miles', 'km') => '80 km'
• convertLength(32, 'km', 'miles') => '20 miles'
• convertLength(50, 'km', 'km') => '50 km'

7h. Update convertLength to support converting between km, miles,
and also feet. Note: 1 mile = 5280 ft, 1 km = 3281 ft (approximately).• convertLength(5, 'miles', 'km') => '8 km'
• convertLength(5, 'miles', 'ft') => '26400 ft'
• convertLength(5, 'km', 'ft') => '16405 ft'


7i. Update convertLength so that if you give it an invalid unit, it wilreturn Invalid unit: ${unit}.
• convertLenath(5. 'Ibs'. 'Ibs') => 'Invalid unit: Ibs'


-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex</title>

  <body>
    <script>
      function convertlength(length, from, to) {
        if (from === to) {
          return `${length} ${to}`;
        }

        if (from === "miles" && to === "km") {
          return `${length * 1.6} miles`;
        }

        if (from === "km" && to === "miles") {
          return `${length / 1.6} KM`;
        }
      }

      //   console.log(convertlength(50, "miles", "km"));
      //   console.log(convertlength(80, "km", "miles"));
      //   console.log(convertlength(50, "km", "km"));

      function convertLength2(length, from, to) {
        if (from === to) {
          return `${length} ${to}`;
        }

        if (from === "miles" && to === "km") {
          return `${length * 1.6} miles`;
        }

        if (from === "km" && to === "miles") {
          return `${length / 1.6} KM`;
        }

        if (from === "miles" && to === "ft") {
          return `${length * 5280} ft`;
        }

        if (from === "km" && to === "ft") {
          return `${length * 3281} ft`;
        }

        if (from === "ft" && to === "miles") {
          return `${length / 5280} miles`;
        }

        if (from === "ft" && to === "km") {
          return `${length / 3281} km`;
        }
      }

      console.log(convertLength2(5, "miles", "km")); // 8 miles
      console.log(convertLength2(5, "miles", "ft")); // 26400 ft
      console.log(convertLength2(5, "km", "ft")); // 16405 ft
    </script>
