<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handle unit</title>
  </head>
  <body>
    <script>
      function convertLength(length, from, to) {
        if (from !== "km" && from !== "miles" && from !== "ft") {
          return `Invalid unit: ${from}`;
        }

        if (to !== "km" && to !== "miles" && to !== "ft") {
          return `Invalid ${to}`;
        }

        if (from === "miles" && to === "km") {
          return `${length * 1.6} km`;
        }

        if (from === "km" && to === "miles") {
          return `${length / 1.6} miles`;
        }

        if (from === "miles" && to === "ft") {
          return `${length * 5280} ft`;
        }

        if (from === "km" && to === "ft") {
          return `${length * 3281} ft`;
        }

        if (from === "ft" && to === "miles") {
          return `${length / 5280} miles`;
        }

        if (from === "ft" && to === "km") {
          return `${length / 3281} km`;
        }
      }

      console.log(convertLength(5, "miles", "km")); // 8 km
      console.log(convertLength(5, "miles", "ft")); // 26400 ft
      console.log(convertLength(5, "km", "ft")); // 16405 ft
      console.log(convertLength(5, "lbs", "lbs")); // Invalid unit: lbs
    </script>
  </body>
</html>
